# Workflow para publicar en GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta cada vez que haces push a la rama main
  push:
    branches: ['main']

  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions
  workflow_dispatch:

# Otorga permisos a GITHUB_TOKEN para poder desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue a la vez, omitiendo ejecuciones encoladas si hay un nuevo push
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Trabajo de despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube la carpeta dist generada por Vite
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
